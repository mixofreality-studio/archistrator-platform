name: Release Gate

# A module tag is a release. The platform has no tagging workflow (tags are
# pushed by hand: `git push origin fpc/main --tags`), so this workflow gates
# them after the fact: when a tag for a module that apps consume is pushed, the
# conformance jobs of Platform Checks (conformance, conformance-proof,
# conformance-discriminate, conformance-discriminate-impl) must have passed on the SAME commit,
# otherwise this run fails and the tag must be deleted and re-cut from a green SHA.
#
# Wait budget: with one `git push origin fpc/main --tags` this run starts at the
# same moment as Platform Checks, whose `go` job (build, lint, test of every
# module) must finish before the conformance jobs even start. They run in
# parallel; the longest, conformance-discriminate-impl, measured 73 minutes and
# has a 150 minute budget, so the gate polls for up to 170 minutes (170 x 60s)
# under a 180 minute job timeout, which covers the go job and the longest
# conformance job end to end even at its timeout. A job that times out ends
# `timed_out`, which fails the gate at once rather than at the end of the poll.

on:
  push:
    tags:
      - 'framework-go/v*'
      - 'framework-go-app-generator/v*'
      - 'framework-go-conformance/v*'
      - 'method-assets/v*'

jobs:
  require-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      checks: read
    steps:
      # Annotated tags peel to a commit; resolve it explicitly rather than
      # trusting github.sha to be the commit and not the tag object.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require green conformance, conformance-proof, conformance-discriminate and conformance-discriminate-impl check runs on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          echo "tag ${TAG} resolves to commit ${SHA}"
          for check in conformance conformance-proof conformance-discriminate conformance-discriminate-impl; do
            passed=0
            for attempt in $(seq 1 170); do
              conclusion="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?check_name=${check}" \
                --jq "[.check_runs[] | select(.name == \"${check}\")] | sort_by(.started_at) | last | .conclusion // \"none\"")"
              echo "${check} on ${SHA} for ${TAG}: ${conclusion} (attempt ${attempt})"
              case "${conclusion}" in
                success) passed=1; break ;;
                failure|cancelled|timed_out|action_required|skipped|neutral|stale)
                  echo "::error::${check} did not pass on ${SHA}; ${TAG} must not be released"
                  exit 1 ;;
              esac
              sleep 60
            done
            if [ "${passed}" -ne 1 ]; then
              echo "::error::no finished ${check} run on ${SHA}; ${TAG} must not be released"
              exit 1
            fi
          done
