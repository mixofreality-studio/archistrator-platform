name: Release Gate

# A module tag is a release. The platform has no tagging workflow (tags are
# pushed by hand: `git push origin fpc/main --tags`), so this workflow gates
# them after the fact: when a tag for a module that apps consume is pushed, the
# `conformance` job of Platform Checks must have passed on the SAME commit,
# otherwise this run fails and the tag must be deleted and re-cut from a green SHA.
#
# Wait budget: with one `git push origin fpc/main --tags` this run starts at the
# same moment as Platform Checks, whose `go` job (build, lint, test of every
# module) must finish before `conformance` (own 60 minute budget) even starts.
# The gate therefore polls for up to 120 minutes (120 x 60s) under a 130 minute
# job timeout, which covers both jobs end to end.

on:
  push:
    tags:
      - 'framework-go/v*'
      - 'framework-go-app-generator/v*'
      - 'method-assets/v*'

jobs:
  require-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      checks: read
    steps:
      # Annotated tags peel to a commit; resolve it explicitly rather than
      # trusting github.sha to be the commit and not the tag object.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a green conformance check run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          echo "tag ${TAG} resolves to commit ${SHA}"
          for attempt in $(seq 1 120); do
            conclusion="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?check_name=conformance" \
              --jq '[.check_runs[] | select(.name == "conformance")] | sort_by(.started_at) | last | .conclusion // "none"')"
            echo "conformance on ${SHA} for ${TAG}: ${conclusion} (attempt ${attempt})"
            case "${conclusion}" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|skipped|neutral|stale)
                echo "::error::conformance did not pass on ${SHA}; ${TAG} must not be released"
                exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::no finished conformance run on ${SHA}; ${TAG} must not be released"
          exit 1
