name: Platform Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      # framework-go-projectmodel/-app-generator/-http-generator/-mcp-generator
      # build standalone under GOWORK=off: projectmodel and mcp-generator have
      # no sibling deps at all; app-generator and http-generator resolve
      # framework-go (and, for app-generator, framework-go-projectmodel) via
      # `replace` directives in their own go.mod pointing at the sibling
      # checkout, which this job satisfies since actions/checkout@v6 above
      # checks out the whole repo.
      - name: Build all platform Go modules
        run: |
          for m in framework-go framework-go-infrastructure-* framework-go-projectmodel framework-go-app-generator framework-go-http-generator framework-go-mcp-generator method-assets; do
            echo "== $m =="
            ( cd "$m" && GOWORK=off go build ./... )
          done
      - name: Install golangci-lint
        # Pinned: an unpinned install takes whatever release is newest, so a new linter
        # release could turn main red with no code change. Bump deliberately.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.2/install.sh | sh -s -- -b /usr/local/bin v2.13.2
      - name: Lint all platform Go modules
        run: |
          for m in framework-go framework-go-infrastructure-* framework-go-projectmodel framework-go-app-generator framework-go-http-generator framework-go-mcp-generator method-assets; do
            echo "== $m =="
            ( cd "$m" && GOWORK=off golangci-lint run ./... )
          done
      - name: Test all platform Go modules
        run: |
          for m in framework-go framework-go-infrastructure-* framework-go-projectmodel framework-go-app-generator framework-go-http-generator framework-go-mcp-generator method-assets; do
            echo "== $m =="
            ( cd "$m" && GOWORK=off go test ./... )
          done
      # The seated workflows are templates, so lint what the scaffold actually
      # RENDERS: dump them (an env-gated method-assets test) and run actionlint,
      # which runs shellcheck (preinstalled on ubuntu-latest) over every run: body.
      - name: Lint the rendered method-assets workflows (actionlint + shellcheck)
        run: |
          render_dir="${RUNNER_TEMP}/method-assets-render"
          mkdir -p "${render_dir}"
          ( cd method-assets && METHODASSETS_RENDER_DIR="${render_dir}" GOWORK=off go test -count=1 -run '^TestDumpRenderedWorkflowsForLint$' . )
          cd "${render_dir}"
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: framework-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # 22: the preview runtime's tests run under `node --test` over the TS
          # sources (native type stripping, unflagged from Node 22.18).
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      # The preview's guards and CSP are proved in a real browser (test/browser/).
      - run: npx playwright install --with-deps chromium
      - run: npm test
